name: Release

# Pushing a version tag (npm run release does it) builds the Mac app and publishes it as a GitHub release.
# Installed copies of Protoplasma find it within a few hours and update themselves.
on:
  push:
    tags: ['v*']
  # Or Actions → Release → Run workflow, on main: releases package.json's version, and the release makes its tag. For
  # when a tag can't be pushed from where you are; the version still has to be bumped on main first.
  workflow_dispatch:

# Dependency code (npm ci, the allowed install scripts, the tests, the packager) runs only in `build`, which has no
# secrets. `sign` installs nothing, checks out only sign.sh and the release notes, and is the one job that can read the
# signing certificate and publish: it runs in the `release` environment (Settings → Environments: add required
# reviewers there, and keep MAC_CERT_P12 and MAC_CERT_PASSWORD as that environment's secrets).
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false # an allowed install script still runs (npm run setup): leave no GitHub token in .git for it
      # Every installed copy updates to whatever is released here, so only a commit that is on main ships.
      - name: Check the commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # TAG is v<package.json version>: the pushed tag must say the same, and a run from the Actions page must be on
      # main and for a version that isn't released yet.
      - name: Check the tag matches package.json
        id: tag
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            [ "$GITHUB_REF" = refs/heads/main ] || { echo "Run it on main."; exit 1; }
            found=0; git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null || found=$? # 2: no such tag
            if [ "$found" = 0 ]; then echo "$TAG is already tagged: bump the version on main first."; exit 1; fi
            [ "$found" = 2 ] || { echo "Couldn't check whether $TAG is already tagged."; exit 1; }
          else
            [ "$GITHUB_REF_NAME" = "$TAG" ] || { echo "The tag $GITHUB_REF_NAME doesn't match package.json ($TAG)."; exit 1; }
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run setup # only the install scripts package.json allowScripts names (.npmrc skips all others)
      - run: npm test
      - run: npm run dist
      # A tar keeps the app's symlinks and permissions, which an artifact's own zip would lose.
      - run: tar -czf app.tgz -C dist.noindex/Protoplasma-darwin-arm64 Protoplasma.app
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-app
          path: app.tgz
          retention-days: 7 # the sign job may wait days for its reviewer

  sign:
    needs: build
    runs-on: macos-latest
    environment: release
    permissions:
      contents: write
    env:
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/sign.sh
            docs/release-notes
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-app
      # Only the app, into a folder of its own: anything else in the tar (a path out of it, a replacement sign.sh) is refused.
      - run: |
          if tar -tzf app.tgz | grep -qvE '^Protoplasma\.app(/|$)'; then echo "app.tgz holds something besides Protoplasma.app"; exit 1; fi
          mkdir out && tar -xzf app.tgz -C out
      - name: Sign with the project's own certificate (no Apple account needed) and zip
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          scripts/sign.sh out/Protoplasma.app
          ditto -c -k --keepParent out/Protoplasma.app "Protoplasma-${TAG#v}-mac-arm64.zip"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # docs/release-notes/<version>.md, when there is one, goes above the generated list of changes. --target makes the
        # tag at this commit when it doesn't exist yet (a run from the Actions page); a pushed tag stays where it is.
        run: |
          NOTES="docs/release-notes/${TAG#v}.md"
          gh release create "$TAG" Protoplasma-*-mac-arm64.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Protoplasma ${TAG#v}" --generate-notes ${NOTES:+$( [ -f "$NOTES" ] && echo "--notes-file $NOTES")}
