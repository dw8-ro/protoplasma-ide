name: Release

# Pushing a version tag (npm run release does it) builds the Mac app and publishes it as a GitHub release.
# Installed copies of Protoplasma find it within a few hours and update themselves.
on:
  push:
    tags: ['v*']
  # Or Actions → Release → Run workflow, on main: releases package.json's version, and the release makes its tag. For
  # when a tag can't be pushed from where you are; the version still has to be bumped on main first.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false # npm ci runs dependencies' install scripts: leave no GitHub token in .git for them
      # Every installed copy updates to whatever is released here, so only a commit that is on main ships.
      - name: Check the commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # TAG is v<package.json version>: the pushed tag must say the same, and a run from the Actions page must be on
      # main and for a version that isn't released yet.
      - name: Check the tag matches package.json
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            [ "$GITHUB_REF" = refs/heads/main ] || { echo "Run it on main."; exit 1; }
            found=0; git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null || found=$? # 2: no such tag
            if [ "$found" = 0 ]; then echo "$TAG is already tagged: bump the version on main first."; exit 1; fi
            [ "$found" = 2 ] || { echo "Couldn't check whether $TAG is already tagged."; exit 1; }
          else
            [ "$GITHUB_REF_NAME" = "$TAG" ] || { echo "The tag $GITHUB_REF_NAME doesn't match package.json ($TAG)."; exit 1; }
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - name: Sign with the project's own certificate (no Apple account needed) and zip
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          scripts/sign.sh dist.noindex/Protoplasma-darwin-arm64/Protoplasma.app
          ditto -c -k --keepParent dist.noindex/Protoplasma-darwin-arm64/Protoplasma.app "Protoplasma-${TAG#v}-mac-arm64.zip"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # docs/release-notes/<version>.md, when there is one, goes above the generated list of changes. --target makes the
        # tag at this commit when it doesn't exist yet (a run from the Actions page); a pushed tag stays where it is.
        run: |
          NOTES="docs/release-notes/${TAG#v}.md"
          gh release create "$TAG" Protoplasma-*-mac-arm64.zip --target "$GITHUB_SHA" --title "Protoplasma ${TAG#v}" --generate-notes ${NOTES:+$( [ -f "$NOTES" ] && echo "--notes-file $NOTES")}
