<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Hero: two agents in one session</title>
<link rel="stylesheet" href="stage.css">
</head>
<body>
<div class="stage">
  <div class="field">
    <div class="pool"></div>
    <div class="grid"></div>
    <!-- purple under your agent, teal under your teammate's -->
    <div class="glow me" style="left: -60px; top: 180px; width: 720px; height: 640px"></div>
    <div class="glow mate" style="left: 620px; top: 180px; width: 720px; height: 640px"></div>
  </div>
  <!-- the whole window -->
  <div class="crop" data-src="session" data-x="0" data-y="0" data-w="2880" data-h="1800" data-s="0.68" style="left: 150px; top: 36px"></div>
</div>
<script src="crop.js"></script>
</body>
</html>
